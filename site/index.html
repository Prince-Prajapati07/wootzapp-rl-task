<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MiniShop</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 32px; background: #f7f7f2; color: #222; }
    main { max-width: 720px; margin: auto; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
    .product { border: 1px solid #ccc; padding: 12px; margin: 10px 0; background: white; }
    button { padding: 10px 14px; border: 1px solid #222; background: white; cursor: pointer; }
    button:hover { background: #e9f2ff; }
    #popup { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; place-items: center; z-index: 10; }
    #popup > div { background: white; padding: 24px; border: 2px solid #222; text-align: center; }
    .hidden-buttons button { visibility: hidden; }
  </style>
</head>
<body>
  <main>
    <h1>MiniShop</h1>
    <p id="goal"></p>
    <section id="app"></section>
    <p id="order-result" data-placed="false" data-item="" data-qty=""></p>
  </main>
  <div id="popup"><div><p>Special offer popup</p><button id="dismiss">Dismiss</button></div></div>

  <script>
    const products = [
      { id: "blue-mug", name: "Blue Mug" },
      { id: "red-shirt", name: "Red Shirt" },
      { id: "green-cap", name: "Green Cap" },
      { id: "black-book", name: "Black Book" }
    ];

    const params = new URLSearchParams(location.search);
    const goalItem = params.get("item") || "blue-mug";
    const goalQty = Number(params.get("qty") || "1");
    const popupP = Number(params.get("popup_p") || "0");
    const delayP = Number(params.get("delay_p") || "0");
    let seed = Number(params.get("seed") || "1") >>> 0;

    function mulberry32() {
      seed |= 0;
      seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }

    let screen = "catalog";
    let currentItem = null;
    let currentQty = 1;
    let cartItem = null;
    let cartQty = 0;
    let orderPlaced = false;
    let orderItem = "";
    let orderQty = 0;
    let popupVisible = false;

    const app = document.getElementById("app");
    const popup = document.getElementById("popup");
    const result = document.getElementById("order-result");
    document.getElementById("goal").textContent = "Goal: " + goalItem + " x" + goalQty;
    document.getElementById("dismiss").onclick = () => {
      popupVisible = false;
      popup.style.display = "none";
      updateHook();
    };

    function updateHook() {
      window.__shop = { screen, popupVisible, orderPlaced, orderItem, orderQty };
      result.dataset.placed = String(orderPlaced);
      result.dataset.item = orderItem;
      result.dataset.qty = String(orderQty || "");
    }

    function changeScreen(next) {
      screen = next;
      render();
      if (mulberry32() < popupP) {
        popupVisible = true;
        popup.style.display = "grid";
      }
      updateHook();
    }

    function maybeDelayButtons() {
      app.classList.remove("hidden-buttons");
      if (mulberry32() < delayP) {
        app.classList.add("hidden-buttons");
        const ms = 50 + Math.floor(mulberry32() * 251);
        setTimeout(() => app.classList.remove("hidden-buttons"), ms);
      }
    }

    function render() {
      if (screen === "catalog") renderCatalog();
      if (screen === "product") renderProduct();
      if (screen === "cart") renderCart();
      if (screen === "newsletter") renderNewsletter();
      if (screen === "done") renderDone();
      maybeDelayButtons();
      updateHook();
    }

    function renderCatalog() {
      app.innerHTML = "";
      products.forEach((p) => {
        const box = document.createElement("div");
        box.className = "product";
        box.innerHTML = `<strong>${p.name}</strong> <span>(${p.id})</span> `;
        const btn = document.createElement("button");
        btn.textContent = "View";
        btn.onclick = () => { currentItem = p.id; currentQty = 1; changeScreen("product"); };
        box.appendChild(btn);
        app.appendChild(box);
      });
      const news = document.createElement("button");
      news.textContent = "Newsletter";
      news.onclick = () => changeScreen("newsletter");
      app.appendChild(news);
    }

    function renderProduct() {
      const p = products.find(x => x.id === currentItem);
      app.innerHTML = `<h2>${p.name}</h2><p>Quantity: <span id="qty">${currentQty}</span></p>`;
      addButton("-", () => { currentQty = Math.max(1, currentQty - 1); render(); });
      addButton("+", () => { currentQty = Math.min(3, currentQty + 1); render(); });
      addButton("Add to cart", () => { cartItem = currentItem; cartQty = currentQty; changeScreen("cart"); });
      addButton("Back", () => changeScreen("catalog"));
    }

    function renderCart() {
      app.innerHTML = `<h2>Cart</h2><p>${cartItem} x${cartQty}</p>`;
      addButton("Checkout", () => {
        orderPlaced = true;
        orderItem = cartItem;
        orderQty = cartQty;
        changeScreen("done");
      });
      addButton("Clear cart", () => { cartItem = null; cartQty = 0; changeScreen("catalog"); });
      addButton("Back", () => changeScreen("product"));
    }

    function renderNewsletter() {
      app.innerHTML = "<h2>Newsletter</h2><p>No useful shopping here.</p>";
      addButton("Back", () => changeScreen("catalog"));
    }

    function renderDone() {
      app.innerHTML = `<h2>Order placed</h2><p>${orderItem} x${orderQty}</p>`;
      result.textContent = `Order placed: ${orderItem} x${orderQty}`;
    }

    function addButton(text, onClick) {
      const b = document.createElement("button");
      b.textContent = text;
      b.onclick = onClick;
      app.appendChild(b);
    }

    render();
  </script>
</body>
</html>
